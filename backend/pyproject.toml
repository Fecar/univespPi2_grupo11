[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Felipe Caetano",email = "fecae95@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic (==1.20.0)",
    "blinker (==1.9.0)",
    "click (==8.5.0)",
    "dotenv (==0.9.9)",
    "flask (==3.1.3)",
    "flask-migrate (==4.1.0)",
    "flask-sqlalchemy (==3.1.1)",
    "greenlet (==3.5.6)",
    "gunicorn (==26.2.0)",
    "itsdangerous (==2.2.0)",
    "jinja2 (==3.1.6)",
    "mako (==1.4.1)",
    "markupsafe (==3.0.3)",
    "psycopg2-binary (==2.9.12)",
    "python-dotenv (==1.2.3)",
    "sqlalchemy (==2.0.53)",
    "typing-extensions (==4.16.0)",
    "werkzeug (==3.1.8)",
    "apiflask (>=3.1.2,<4.0.0)",
    "flask-jwt-extended (>=4.7.4,<5.0.0)",
    "flask-cors (>=6.0.5,<7.0.0)"
]


#[tool.pytest.ini_options]
#pythonpath = ["."]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "typos (>=1.51.1,<2.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=.', '--cov-context=test', '-vv']

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[tool.taskipy.tasks]
lint = 'ruff check'
format = 'ruff format'
run = 'fastapi dev fastapi_zero/app.py'
test = 'pytest -x'
post_test = 'coverage html'
